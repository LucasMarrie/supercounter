<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>supercounter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <div class="grid"></div>

    <div class="reset-corner">
      <button id="resetToggle" class="reset-toggle" type="button" aria-label="Set counter" title="Set counter">&#8635;</button>
      <form id="resetForm" class="reset-form" hidden>
        <input id="resetValue" class="reset-value" type="number" placeholder="0" step="1" />
        <input id="resetPassword" type="password" placeholder="password" autocomplete="off" />
        <button type="submit">Set</button>
      </form>
    </div>

    <main class="panel">
      <div class="counter-wrap">
        <div id="counter" class="counter placeholder">&nbsp;</div>
      </div>

      <div class="button-row">
        <button id="increment" class="increment-btn" aria-label="Increment"></button>
        <button id="decrement" class="increment-btn decrement-btn" aria-label="Decrement"></button>
      </div>

      <div id="status" class="status">connecting&hellip;</div>
    </main>
  </div>

  <script src="client.js"></script>
</body>
</html>
