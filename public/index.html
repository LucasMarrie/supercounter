<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>supercounter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene">
    <div class="grid"></div>

    <main class="panel">
      <div class="label">GLOBAL COUNTER</div>

      <div class="counter-wrap">
        <div id="counter" class="counter">0</div>
      </div>

      <button id="increment" class="increment-btn">
        <span>INCREMENT</span>
      </button>

      <div id="status" class="status">connecting&hellip;</div>
    </main>
  </div>

  <script src="client.js"></script>
</body>
</html>
